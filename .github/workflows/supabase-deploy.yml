name: Deploy Supabase backend

# Runs whenever something under supabase/ changes on main, or when
# started manually from the Actions tab. It links to the TIPIT Supabase
# project, applies any new migrations, updates the Edge Function
# secrets, and (re)deploys every Edge Function.

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Run database migrations
        run: supabase db push

      - name: Set Edge Function secrets
        run: |
          supabase secrets set \
            MAPBOX_PUBLIC_TOKEN="${{ secrets.MAPBOX_TOKEN }}" \
            GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"

      - name: Deploy Edge Functions
        run: supabase functions deploy
