name: Deploy to TestFlight

# Manual only for now — a TestFlight upload has real effects (App Store
# Connect processing, testers potentially notified), so it shouldn't fire
# on every push. Run it from the Actions tab whenever you want a new
# build out. Requires ios/App/App.xcodeproj to already exist — run the
# "Bootstrap iOS project" workflow first if it doesn't.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: macos-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the iOS project exists
        run: |
          if [ ! -f "ios/App/App.xcodeproj/project.pbxproj" ]; then
            echo "::error::ios/App/App.xcodeproj not found. Run the 'Bootstrap iOS project' workflow first."
            exit 1
          fi

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web dependencies and build
        run: |
          npm ci
          npm run build

      - name: Sync web build into the iOS project
        run: npx cap sync ios

      - name: Set up Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios/App

      - name: Build and upload to TestFlight
        working-directory: ios/App
        run: bundle exec fastlane beta
